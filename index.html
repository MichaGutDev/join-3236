<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join</title>
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles/buttons.css">
    <link rel="stylesheet" href="styles/auth.css">
    <link rel="shortcut icon" href="assets/icons/favicon.svg" type="image/x-icon">
</head>

<body class="auth-body">
    <header class="auth-header">
        <div class="auth-header-content">
            <img src="./assets/icons/login-icon.svg" alt="Join Icon" class="auth-icon">
            <div class="auth-header-right">
                <p>Not a Join User?</p>
                <button class="btn btn-primary">Sign Up</button>
            </div>
        </div>
    </header>

    <main class="auth-main">
        <form class="auth-card" id="login-form" novalidate>
            <h1>Log in</h1>
            <label class="auth-field" for="email">
                <span class="visually-hidden">Required field: Email address</span>
                <input type="email" required id="email" placeholder="Email">
                <img src="./assets/icons/mail-icon.svg" alt="Mail Icon">
            </label>
            <div class="auth-field-group">
                <label class="auth-field" for="password">
                    <span class="visually-hidden">Required field: password</span>
                    <input type="password" required id="password" placeholder="Password">
                    <img src="./assets/icons/lock-icon.svg" alt="Lock Icon" id="password-icon">
                </label>
                <span class="error-message" id="login-error"></span>
            </div>
            <div class="auth-actions">
                <button class="btn btn-primary" type="submit" id="login-submit">Log in</button>
                <button class="btn btn-secondary" type="button" id="guest-login">Guest Log in</button>
            </div>
        </form>



    </main>

    <footer class="auth-footer">
        <a href="./html/privacy_policy_external.html">Privacy Policy</a>
        <a href="./html/legal_notice_external.html">Legal notice</a>
    </footer>

    <script src="script.js"></script>
    <script type="module" src="./js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>

</html>
