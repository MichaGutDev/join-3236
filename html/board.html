<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join</title>
    <link rel="stylesheet" href="../styles/variables.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../styles/buttons.css">
    <link rel="stylesheet" href="../styles/board.css">
    <link rel="stylesheet" href="../styles/move-task.css">
    <link rel="stylesheet" href="../styles/board-dialog.css">
    <link rel="stylesheet" href="../styles/add-task.css">
    <link rel="stylesheet" href="../styles/assigned-to.css">
    <link rel="stylesheet" href="../styles/subtasks.css">
    <link rel="stylesheet" href="../styles/toast.css">
    <link rel="shortcut icon" href="../assets/icons/favicon.svg" type="image/x-icon">
</head>

<body>
    <aside>
        <div class="aside-join-icon">
            <img src="../assets/icons/main-icon.svg" alt="">

        </div>


        <nav class="sidebar-nav">
            <a href="summary.html" class="nav-item">
                <img src="../assets/icons/summary-icon.svg" alt="">
                <span>Summary</span>
            </a>

            <a href="add-task.html" class="nav-item ">
                <img src="../assets/icons/add-task-icon.svg" alt="">
                <span>Add Task</span>
            </a>

            <a href="board.html" class="nav-item active">
                <img src="../assets/icons/board-icon.svg" alt="">
                <span>Board</span>
            </a>

            <a href="contacts.html" class="nav-item">
                <img src="../assets/icons/contacts-icon.svg" alt="">
                <span>Contacts</span>
            </a>
        </nav>
        <nav class="sidebar-footer-nav">
            <a href="privacy-policy.html" class="footer-nav-item">
                <span>Privacy Policy</span>
            </a>

            <a href="legal-notice.html" class="footer-nav-item">
                <span>Legal notice</span>
            </a>
        </nav>
    </aside>

    <main>
        <header class="header">
            <img src="../assets/icons/login-icon.svg" alt="Join" class="header-logo-mobile">
            <p class="header-title">Kanban Project Management Tool</p>

            <div class="header-actions">
                <a href="help.html" class="help-button" aria-label="Help">
                    <img src="../assets/icons/help-questionmark-icon.svg" alt="">
                </a>

                <div class="user-menu-wrapper">
                    <button class="user-avatar" aria-label="Open user menu">
                        <span id="user-initials">SM</span>
                    </button>
                    <div class="user-menu">
                        <a href="help.html" class="user-menu-item user-menu-item--help">
                            <span>Help</span>
                        </a>
                        <a href="legal-notice.html" class="user-menu-item">
                            <span>Legal Notice</span>
                        </a>
                        <a href="privacy-policy.html" class="user-menu-item">
                            <span>Privacy Policy</span>
                        </a>
                        <button id="logout-button" class="user-menu-item">Log out</button>
                    </div>
                </div>
            </div>
        </header>

        <div class="board-title-row">
            <h1>Board</h1>
            <div class="board-actions">
                <div class="board-search">
                    <input id="search-task" type="search" placeholder="Find Task">
                    <img src="../assets/icons/search.svg" alt="Find Task">
                    <p id="no-results-message" class="no-results-message" hidden>No matching tasks found.</p>
                </div>
                <button class="btn btn-primary board-add-task-btn add-task-btn" data-status="To Do" aria-label="Add task">
                    <span class="board-add-task-text">Add task</span>
                    <img src="../assets/icons/add.svg" alt="">
                </button>
            </div>
        </div>


        <div class="board-wrapper">
            <section class="task-col">
                <h3 class="taskgroup-header">To do</h3>
                <button class="add-task-btn" data-status="To Do" aria-label="Add task to To do"></button>
                <ul id="to_do" class="task-column" data-status="To Do"></ul>
            </section>

            <section class="task-col">
                <h3 class="taskgroup-header">In progress</h3>
                <button class="add-task-btn" data-status="In Progress" aria-label="Add task to In progress"></button>
                <ul id="in_progress" class="task-column" data-status="In Progress"></ul>


            </section>

            <section class="task-col">
                <h3 class="taskgroup-header">Await feedback</h3>
                <button class="add-task-btn" data-status="Awaiting Feedback" aria-label="Add task to Await feedback"></button>
                <ul id="await_feedback" class="task-column" data-status="Awaiting Feedback"></ul>
            </section>

            <section class="task-col">
                <h3 class="taskgroup-header">Done</h3>
                <ul id="done" class="task-column" data-status="Done"></ul>
            </section>
        </div>

        <dialog id="task-dialog" class="task-dialog">
            <button onclick="closeTaskDialog()">Close</button>
            <section id="task-dialog-content">
            </section>
        </dialog>


    </main>
    <div id="toast" class="toast"></div>

    <script type="module" src="../script.js"></script>
    <script type="module" src="../js/board.js"></script>
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/auth-check.js"></script>
</body>


</html>
