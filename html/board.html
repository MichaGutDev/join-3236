<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../styles/buttons.css">
    <link rel="stylesheet" href="../styles/board.css">
    <link rel="shortcut icon" href="../assets/icons/favicon.svg" type="image/x-icon">
    <script src="../js/db.js"></script>
</head>

<body onload="init()">
    <aside>
        <div class="aside-join-icon">
            <img src="../assets/icons/main-icon.svg" alt="">

        </div>


        <nav class="sidebar-nav">
            <a href="summary.html" class="nav-item">
                <img src="../assets/icons/summary-icon.svg" alt="">
                <span>Summary</span>
            </a>

            <a href="add_task.html" class="nav-item ">
                <img src="../assets/icons/add-task-icon.svg" alt="">
                <span>Add Task</span>
            </a>

            <a href="board.html" class="nav-item active">
                <img src="../assets/icons/board-icon.svg" alt="">
                <span>Board</span>
            </a>

            <a href="contacts.html" class="nav-item">
                <img src="../assets/icons/contacts-icon.svg" alt="">
                <span>Contacts</span>
            </a>
        </nav>
        <nav class="sidebar-footer-nav">
            <a href="privacy_policy.html" class="footer-nav-item">
                <span>Privacy Policy</span>
            </a>

            <a href="legal_notice.html" class="footer-nav-item">
                <span>Legal notice</span>
            </a>
        </nav>
    </aside>

    <main>
        <header class="header">
            <p class="header-title">Kanban Project Management Tool</p>

            <div class="header-actions">
                <a href="help.html" class="help-button" aria-label="Help">
                    <img src="../assets/icons/help-questionmark-icon.svg" alt="">
                </a>

                <div class="user-menu-wrapper">
                    <button class="user-avatar" aria-label="Open user menu">
                        <span id="userInitials">SM</span>
                    </button>
                    <div class="user-menu">
                        <a href="legal_notice.html" class="user-menu-item">
                            <span>Legal Notice</span>
                        </a>
                        <a href="privacy_policy.html" class="user-menu-item">
                            <span>Privacy Policy</span>
                        </a>
                        <button id="logout-button" class="user-menu-item">Log out</button>
                    </div>
                </div>
            </div>
        </header>

        <div class="board-title-row">
            <h1>Board</h1>
            <div class="board-actions">
                <div class="board-search">
                    <input id="search-task" type="text" placeholder="Find Task">
                    <img src="../assets/icons/search.svg" alt="Find Task">
                    <p id="no-results-message" hidden>No matching tasks found.</p>
                </div>
                <a href="add_task.html" class="btn btn-primary board-add-task-btn">Add task
                    <img src="../assets/icons/add.svg" alt="">
                </a>
            </div>
        </div>


        <div class="board-wrapper">
            <section class="task-col">
                <h3 class="taskgroup-header">To Do:</h3>
                <ul id="to_do" ondragover="allowDrop(event); highlight('to_do')" ondragleave="removeHighlight('to_do')" ondrop="moveTaskTo('To Do')">

                </ul>
            </section>

            <section class="task-col">
                <h3 class="taskgroup-header">In Progress:</h3>
                <ul id="in_progress" ondragover="allowDrop(event); highlight('in_progress')" ondragleave="removeHighlight('in_progress')" ondrop="moveTaskTo('In Progress')">
                    <li></li>
                </ul>
            </section>

            <section class="task-col">
                <h3 class="taskgroup-header">Awaiting Feedback:</h3>
                <ul id="await_feedback" ondragover="allowDrop(event); highlight('await_feedback')" ondragleave="removeHighlight('await_feedback')" ondrop="moveTaskTo('Awaiting Feedback')">
                    <li></li>
                </ul>
            </section>

            <section class="task-col">
                <h3 class="taskgroup-header">Done:</h3>
                <ul id="done" ondragover="allowDrop(event); highlight('done')" ondragleave="removeHighlight('done')" ondrop="moveTaskTo('Done')">
                    <li></li>
                </ul>
            </section>
        </div>

        <button onclick="openTaskEdit()">openTaskEditDialog</button>

        <dialog id="task-edit-dialog">
            <button onclick="closeTaskEdit()">Close</button>
            <form id="task-form">
                <!-- Title -->
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" placeholder="Enter a title" required>
                </div>

                <!-- Description -->
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" placeholder="Enter a description" required></textarea>
                </div>

                <!-- Due Date -->
                <div class="form-group">
                    <label for="due-date">Due Date</label>
                    <input type="date" id="due-date" name="dueDate" required>
                </div>

                <!-- Priority -->
                <div class="form-group">
                    <fieldset class="priority">
                        <legend>Priority</legend>

                        <label class="priority-high">
                            <input type="radio" name="priority" value="urgent">
                            <span>Urgent</span><img src="../assets/icons/prio-urgent.svg" alt="">
                        </label>

                        <label class="priority-medium">
                            <input type="radio" name="priority" value="medium" checked>
                            <span>Medium</span><img src="../assets/icons/prio-medium.svg" alt="">
                        </label>

                        <label class="priority-low">
                            <input type="radio" name="priority" value="low">
                            <span>Low</span><img src="../assets/icons/prio-low.svg" alt="">
                        </label>
                    </fieldset>
                </div>

                <!-- Category -->
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="">Select category</option>
                        <option value="User Story">User Story</option>
                        <option value="Technical Task">Technical Task</option>
                    </select>
                </div>

                <!-- Assigned To -->
                <div class="form-group">
                    <label for="assigned-to">Assigned To</label>

                    <select id="assigned-to" name="assignedTo" multiple>
                        <option value="contactId1">Contact 1</option>
                        <option value="contactId2">Contact 2</option>
                        <option value="contactId3">Contact 3</option>
                    </select>
                </div>

                <!-- Subtasks -->
                <div class="form-group">
                    <label for="new-subtask">Subtasks</label>

                    <div class="subtask-input">
                        <input type="text" id="new-subtask" placeholder="Add new subtask">

                        <button type="button" id="add-subtask" class="btn-primary">
                            Add
                        </button>
                    </div>

                    <div id="subtask-list" class="subtask-list">
                        <!-- Subtasks hier rendern -->
                    </div>
                </div>

                <div class="form-actions">
                    <button type="reset" class="btn-secondary">Clear</button>
                    <button type="submit" class="btn-primary">Create Task</button>
                </div>
            </form>
        </dialog>

    </main>

    <script type="module" src="../script.js"></script>
    <!-- <script src="../js/add_task.js"></script> -->
    <script src="../js/board.js"></script>
    <script src="../js/search.js"></script>
    <!-- 
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/auth-check.js"></script> -->
</body>


</html>
