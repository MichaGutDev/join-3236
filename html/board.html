<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../styles/board.css">
    <link rel="shortcut icon" href="../assets/icons/favicon.svg" type="image/x-icon">
    <script src="../js/db.js"></script>
</head>

<body onload="init()">
    <aside>
        <div class="aside-join-icon">
            <img src="../assets/icons/main-icon.svg" alt="">

        </div>


        <nav class="sidebar-nav">
            <a href="#" class="nav-item">
                <img src="../assets/icons/summary-icon.svg" alt="">
                <span>Summary</span>
            </a>

            <a href="#" class="nav-item ">
                <img src="../assets/icons/add-task-icon.svg" alt="">
                <span>Add Task</span>
            </a>

            <a href="#" class="nav-item active">
                <img src="../assets/icons/board-icon.svg" alt="">
                <span>Board</span>
            </a>

            <a href="#" class="nav-item">
                <img src="../assets/icons/contacts-icon.svg" alt="">
                <span>Contacts</span>
            </a>
        </nav>
    </aside>

    <main>
        <header class="header">
            <h2 class="header-title">Kanban Project Management Tool</h2>

            <div class="header-actions">
                <button class="help-button" aria-label="Help">
                    <img src="../assets/icons/help-questionmark-icon.svg" alt="">
                </button>

                <button class="user-avatar" aria-label="Open user menu">
                    <span id="userInitials">SM</span>
                </button>
            </div>
        </header>

        <div class="board-wrapper">
            <section class="task-col">
                <ul id="to_do">
                    
                </ul>
            </section>

            <section class="task-col">
                <ul id="in_progress">
                    <li></li>
                </ul>
            </section>

            <section class="task-col">
                <ul id="await_feedback">
                    <li></li>
                </ul>
            </section>

            <section class="task-col">
                <ul id="done">
                    <li></li>
                </ul>
            </section>
        </div>

    </main>

    <script src="../script.js"></script>
    <!-- <script src="../js/add_task.js"></script> -->
    <script src="../js/board.js"></script>
<!-- 
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/auth-check.js"></script> -->
</body>


</html>
