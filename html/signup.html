<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join</title>
    <link rel="stylesheet" href="../styles/fonts.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../styles/buttons.css">
    <link rel="stylesheet" href="../styles/auth.css">
    <link rel="shortcut icon" href="../assets/icons/favicon.svg" type="image/x-icon">
</head>

<body class="auth-body">
    <header class="auth-header">
        <div class="auth-header-content">
            <img src="../assets/icons/login-icon.svg" alt="Join Icon" class="auth-icon">
        </div>
    </header>

    <main class="auth-main">
        <form class="auth-card" id="signup-form" novalidate>
            <a href="../index.html" class="back-arrow">
                <img src="../assets/icons/arrow-left-line.svg" alt="Back to Login">
            </a>
            <h1>Sign up</h1>
            <label class="auth-field" for="name">
                <span class="visually-hidden">Required field: Name</span>
                <input type="text" required id="name" placeholder="Name">
                <img src="../assets/icons/person-icon.svg" alt="Person Icon">
            </label>
            <label class="auth-field" for="email">
                <span class="visually-hidden">Required field: Email address</span>
                <input type="email" required id="email" placeholder="Email">
                <img src="../assets/icons/mail-icon.svg" alt="Mail Icon">
            </label>
            <label class="auth-field" for="password">
                <span class="visually-hidden">Required field: password</span>
                <input type="password" required id="password" placeholder="Password">
                <img src="../assets/icons/lock-icon.svg" alt="Lock Icon" id="password-icon">
            </label>
            <div class="auth-field-group">
                <label class="auth-field" for="confirm-password">
                    <span class="visually-hidden">Required field: confirm password</span>
                    <input type="password" required id="confirm-password" placeholder="Confirm Password">
                    <img src="../assets/icons/lock-icon.svg" alt="Lock Icon" id="confirm-password-icon">
                </label>
                <span class="error-message" id="signup-error"></span>
            </div>
            <label class="privacy-checkbox">
                <input type="checkbox" required id="privacy-policy">
                I accept the
                <a href="privacy_policy_external.html">Privacy policy</a>
            </label>
            <div class="auth-actions">
                <button class="btn btn-primary" type="submit" id="signup-submit" disabled>Sign up</button>
            </div>
        </form>



    </main>

    <footer class="auth-footer">
        <a href="./privacy_policy_external.html">Privacy Policy</a>
        <a href="./legal_notice_external.html">Legal notice</a>
    </footer>

    <div id="toast" class="toast">You Signed Up successfully</div>

    <script type="module" src="../script.js"></script>
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/auth.js"></script>
</body>

</html>
